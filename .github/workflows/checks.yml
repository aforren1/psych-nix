# Builds all packages and runs all tests (`nix flake check`), including the
# two NixOS VM tests and the PsychoPy pytest suite.
#
# No binary cache is configured, on purpose. The unfree vendor packages
# (SR Research, VPixx) come from the vendors' public URLs during the build,
# and their licenses do not permit redistribution, so they must not be pushed
# to a public cache. A store cache in GitHub's Actions cache (for example
# magic-nix-cache) is readable by pull request runs from forks, so it is not
# used either. Thus each run builds wxPython and octave-ilp64 again.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    # VM tests about 10 minutes, pytest about 7, about 35 minutes of uncached
    # 2026 builds and about 66 minutes for the PsychoPy 2024 set (Python 3.10
    # is not on Hydra). Runners can be slower than a workstation.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      # The closure of all checks is large. GitHub documents 14 GB of SSD for
      # standard runners: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Upstream Nix, as on the fleet. Enables flakes, and with enable_kvm
      # (default true) writes the udev rule KERNEL=="kvm", GROUP="kvm",
      # MODE="0666" before Nix starts, so the daemon detects the `kvm` system
      # feature. Same rule as
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - uses: cachix/install-nix-action@v31
      # Fail early with a clear message instead of a "required system feature" error.
      - name: Check KVM
        run: |
          test -w /dev/kvm
          nix config show system-features | grep -qw kvm
      # No userns sysctl here: the root nix-daemon builds in its own sandbox,
      # and nothing in the checks runs buildFHSEnv (bubblewrap) on the host.
      - run: nix flake check -L --keep-going
